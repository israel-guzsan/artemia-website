<section class="calendar-container">
  <h1>Calendario</h1>
  <p class="intro">El paso del tiempo está ligado a las calendas, flores que cambian con las estaciones.</p>

  <div class="seasons-images">

    <div class="season-image winter">
      <img class="closed" src="assets/calendar/calenda-cerrada.png" alt="Invierno cerrado" />
      <img class="open" src="assets/calendar/calenda-invierno.png" alt="Invierno florecido" />
      <span>Invierno</span>
    </div>

    <div class="season-image spring">
      <img class="closed" src="assets/calendar/calenda-cerrada.png" alt="Primavera cerrado" />
      <img class="open" src="assets/calendar/calenda-primavera.png" alt="Primavera florecido" />
      <span>Primavera</span>
    </div>

    <div class="season-image summer">
      <img class="closed" src="assets/calendar/calenda-cerrada.png" alt="Verano cerrado" />
      <img class="open" src="assets/calendar/calenda-verano.png" alt="Verano florecido" />
      <span>Verano</span>
    </div>

    <div class="season-image autumn">
      <img class="closed" src="assets/calendar/calenda-cerrada.png" alt="Otoño cerrado" />
      <img class="open" src="assets/calendar/calenda-otono.png" alt="Otoño florecido" />
      <span>Otoño</span>
    </div>

  </div>

  <div class="calendar-text">
    <p>
      Las calendas florecen abiertas durante el día y cerradas por la noche.
      Su color indica la estación actual...
    </p>
  </div>

</section>
